<!DOCTYPE html>
<html>

<head>
	<title>three.js css3d - kasatria assessment</title>
	<meta charset="utf-8">

	<meta property="og:title" content="three.js css3d - kasatria assessment">

	<style>
		html,
		body {
			height: 100%;
			margin: 0;
			background-color: #000;
			color: #fff;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

		#info {
			position: absolute;

			width: 100%;

			box-sizing: border-box;

		a {

		#menu {
			position: absolute;

		/* Clean & Professional Google OAuth Login Overlay */
		#login-gate {
			position: fixed;
			inset: 0;
			background: #05070c;
			display: flex;
			flex-direction: column;

		.login-box {

		.login-box h1 {

		.login-box p {

		#google-signin-btn {

		/* 3D Visualizer Cards */
		.card {

		.card .country {
			position: absolute;

			font-size: 12px;

		.card .details {

		button {

		button:active {

<body>

	<div id="login-gate">
		<div class="login-box">
			<h1>Kasatria Assignment</h1>
			<p>Sign in with your Google account to access data</p>

			<div id="google-signin-btn"></div>

			<div id="login-status"></div>
		</div>
	</div>

	<div id="info">
		<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> css3d - kasatria assessment.
	</div>

	<div id="container"></div>

	<div id="menu">
		<button id="table">TABLE</button>
		<button id="sphere">SPHERE</button>
		<button id="helix">HELIX</button>
		<button id="grid">GRID</button>
		<button id="tetrahedron">TETRAHEDRON</button>
	</div>

	<script type="importmap">
		{
			"imports": {
				"three": "https://unpkg.com/three@0.160.0/build/three.module.js",
				"three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
			}
		}
	</script>

	<script type="module">
		import * as THREE from 'three';
		import TWEEN from 'three/addons/libs/tween.module.js';
		import { TrackballControls } from 'three/addons/controls/TrackballControls.js';
		import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

		/**
		 * GoogleAuthManager - Modular Google Identity Services OAuth Handler
		 */
		class GoogleAuthManager {
			constructor({ clientId, onSuccess, onError }) {
				this.clientId = clientId;
				this.onSuccess = onSuccess;
				this.onError = onError;
			}

			init(containerId) {
				const checkGoogleSDK = () => {
					if (window.google && window.google.accounts && window.google.accounts.id) {
						this._setup(containerId);
					} else {
						setTimeout(checkGoogleSDK, 80);
					}
				};
				checkGoogleSDK();
			}

			_setup(containerId) {
				try {
					google.accounts.id.initialize({
						client_id: this.clientId,
						callback: (response) => this._onCredentialResponse(response),
						auto_select: false
					});

					const btnContainer = document.getElementById(containerId);
					if (btnContainer) {
						google.accounts.id.renderButton(btnContainer, {
							type: 'standard',
							theme: 'filled_black',
							size: 'large',
							shape: 'rectangular',
							text: 'signin_with',
							logo_alignment: 'left',
							width: 300
						});
					}
				} catch (err) {
					console.error('Google Auth initialization error:', err);
					if (this.onError) this.onError(err);
				}
			}

			_onCredentialResponse(response) {
				try {
					const userPayload = this.parseJwt(response.credential);
					if (this.onSuccess) this.onSuccess(userPayload, response.credential);
				} catch (err) {
					console.error('Failed to parse Google OAuth token:', err);
					if (this.onError) this.onError(err);
				}
			}

			parseJwt(token) {
				const base64Url = token.split('.')[1];
				const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
				const jsonPayload = decodeURIComponent(
					atob(base64)
						.split('')
						.map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
						.join('')
				);
				return JSON.parse(jsonPayload);
			}
		}

		// Initialize Google OAuth Manager
		const GOOGLE_CLIENT_ID = "3295003780-l1q2g295rpla178e2hev3pkod417vkul.apps.googleusercontent.com";

		const authManager = new GoogleAuthManager({
			clientId: GOOGLE_CLIENT_ID,
			onSuccess: (payload) => {
				console.log('Successfully signed in as:', payload.email);
				const statusEl = document.getElementById('login-status');
				if (statusEl) {
					statusEl.textContent = `Signed in as ${payload.email} — loading data...`;
				}
				loadPeopleAndStart();
			},
			onError: (err) => {
				const statusEl = document.getElementById('login-status');
				if (statusEl) {
					statusEl.innerHTML = `<span style="color:#f66">Sign-in error: ${err.message || 'Authentication failed'}</span>`;
				}
			}
		});

		authManager.init('google-signin-btn');

		// Google Sheets Data Source
		const SHEET_ID = "1K2lMr38qw8G2t2nAxcB3cqBEk_0U9njDZkQBQtDvYb4";
		const API_KEY = "AIzaSyAY_pD2UA7EZOSLf5iBqlosu-OZOsLwzOg";
		const RANGE = "DataTemplate";
		const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${RANGE}?key=${API_KEY}`;

		function parseNetWorth(str) {
			return parseFloat(String(str).replace(/[$,]/g, '')) || 0;
		}

		function netWorthColor(value) {
			if (value > 200000) return '#3A9F48';
			if (value > 100000) return '#FDDA35';
			return '#EF3022';
		}

		function loadPeopleAndStart() {
			const statusEl = document.getElementById('login-status');
			if (statusEl) statusEl.textContent = 'Loading spreadsheet data...';

			fetch(url, { referrerPolicy: 'no-referrer-when-downgrade' })
				.then(async res => {
					if (!res.ok) {
						const errData = await res.json().catch(() => ({}));
						const msg = errData?.error?.message || `HTTP ${res.status}: ${res.statusText}`;
						throw new Error(msg);
					}
					return res.json();
				})
				.then(data => {
					const rows = data.values;
					const headers = rows[0].map(h => h.trim());
					const dataRows = rows.slice(1);

					const idx = {
						name: headers.indexOf('Name'),
						photo: headers.indexOf('Photo'),
						age: headers.indexOf('Age'),
						country: headers.indexOf('Country'),
						interest: headers.indexOf('Interest'),
						netWorth: headers.indexOf('Net Worth'),
					};

					const people = dataRows.map(row => {
						const netWorthValue = parseNetWorth(row[idx.netWorth] || "0");
						return {
							name: row[idx.name] || "",
							photo: row[idx.photo] || "",
							age: row[idx.age] || "",
							country: row[idx.country] || "",
							interest: row[idx.interest] || "",
							netWorth: netWorthValue,
							colorClass: netWorthColor(netWorthValue),
						};
					});

					init(people);
					animate();

					// Hide the login gate overlay
					const gate = document.getElementById('login-gate');
					if (gate) {
						gate.style.opacity = '0';
						gate.style.pointerEvents = 'none';
						setTimeout(() => {
							gate.style.display = 'none';
						}, 500);
					}
				})
				.catch(err => {
					console.error('Failed to load data:', err);
					if (statusEl) {
						statusEl.innerHTML = `<span style="color:#f66">Error loading data: ${err.message}</span>`;
					}
				});
		}

		// 3D Scene Initialization & Controls
		let camera, scene, renderer, controls;
		const objects = [];
		const targets = { table: [], sphere: [], helix: [], grid: [], tetrahedron: [] };

		function init(people) {
			camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 10000);
			camera.position.z = 3000;

			scene = new THREE.Scene();

			people.forEach(p => {
				const card = document.createElement('div');
				card.className = 'card';
				card.style.backgroundColor = p.colorClass + '45';
				card.style.borderStyle = 'solid';
				card.style.borderWidth = '2px';
				card.style.borderColor = p.colorClass;
				card.style.boxShadow = '0px 0px 4px ' + p.colorClass;

				const pic = document.createElement('img');
				pic.className = 'pic';
				pic.src = p.photo;
				pic.onerror = () => { pic.style.opacity = '0.3'; };
				card.appendChild(pic);

				const age = document.createElement('div');
				age.className = 'age';
				age.textContent = p.age;
				card.appendChild(age);

				const country = document.createElement('div');
				country.className = 'country';
				country.textContent = p.country;
				card.appendChild(country);

				const details = document.createElement('div');
				details.className = 'details';
				details.innerHTML = p.name + '<br>' + p.interest;
				card.appendChild(details);

				const objectCSS = new CSS3DObject(card);
				objectCSS.position.x = Math.random() * 4000 - 2000;
				objectCSS.position.y = Math.random() * 4000 - 2000;
				objectCSS.position.z = Math.random() * 4000 - 2000;
				scene.add(objectCSS);

				objects.push(objectCSS);
			});

			// Table Layout
			for (let i = 0; i < people.length; i++) {
				const col = i % 20;
				const row = Math.floor(i / 20);

				const object = new THREE.Object3D();
				object.position.x = col * 140 - ((20 - 1) * 140) / 2;
				object.position.y = row * 180 - ((10 - 1) * 180) / 2;

				targets.table.push(object);
			}

			// Sphere Layout
			const vector = new THREE.Vector3();
			for (let i = 0, l = people.length; i < l; i++) {
				const phi = Math.acos(-1 + (2 * i) / l);
				const theta = Math.sqrt(l * Math.PI) * phi;

				const object = new THREE.Object3D();
				object.position.setFromSphericalCoords(800, phi, theta);
				vector.copy(object.position).multiplyScalar(2);
				object.lookAt(vector);

				targets.sphere.push(object);
			}

			// Double Helix Layout
			for (let i = 0; i < people.length; i++) {
				const strand = i % 2;
				const strandIndex = Math.floor(i / 2);
				const theta = strandIndex * 0.15 + (strand === 1 ? Math.PI : 0);
				const y = -(strandIndex * 16) + 450;

				const object = new THREE.Object3D();
				object.position.setFromCylindricalCoords(900, theta, y);
				vector.x = object.position.x * 2;
				vector.y = object.position.y;
				vector.z = object.position.z * 2;
				object.lookAt(vector);

				targets.helix.push(object);
			}

			// Grid Layout
			for (let i = 0; i < people.length; i++) {
				const object = new THREE.Object3D();
				object.position.x = ((i % 5) * 400) - ((5 - 1) * 400) / 2;
				object.position.y = (-(Math.floor(i / 5) % 4) * 400) + ((4 - 1) * 400) / 2;
				object.position.z = (Math.floor(i / (5 * 4))) * 500 / 2;

				targets.grid.push(object);
			}

			//Tetrahedron Layout
			// Define the 4 corners of a tetrahedron
			const vertices = [
				new THREE.Vector3(1, 1, 1),
				new THREE.Vector3(-1, -1, 1),
				new THREE.Vector3(-1, 1, -1),
				new THREE.Vector3(1, -1, -1),
			];

			// The 4 triangular faces, each defined by 3 of those vertices
			const faces = [
				[vertices[0], vertices[1], vertices[2]],
				[vertices[0], vertices[1], vertices[3]],
				[vertices[0], vertices[2], vertices[3]],
				[vertices[1], vertices[2], vertices[3]],
			];

			// Precompute outward face normals for each triangular face
			const faceNormals = faces.map(face =>
				new THREE.Vector3()
					.add(face[0])
					.add(face[1])
					.add(face[2])
					.normalize()
			);

			const scale = 700; // controls overall size

			const cardsPerFace = Math.ceil(people.length / 4);

			// Calculate how tall(rows) needed to fit the cards on each face
			const R = Math.ceil((Math.sqrt(8 * cardsPerFace + 1) - 1) / 2);

			for (let i = 0; i < people.length; i++) {

				const faceIndex = i % 4;
				const face = faces[faceIndex];
				const faceNormal = faceNormals[faceIndex];

				// Card index on this specific face
				const j = Math.floor(i / 4);

				// Row and column in triangle
				const r = Math.floor((Math.sqrt(8 * j + 1) - 1) / 2);
				const c = j - (r * (r + 1)) / 2;

				// Barycentric coordinates
				const topPost = R > 1 ? 1 - (r / (R - 1)) : 0.33;
				const k = r > 0 ? c / r : 0;  //use to divide how much right or left the card will sit
				const leftPost = (1 - topPost) * (1 - k);
				const rightPost = 1 - topPost - leftPost;

				// Inset slightly to keep cards inside face boundaries
				const u = 0.08 + 0.76 * topPost;
				const v = 0.08 + 0.76 * leftPost;
				const w = 0.08 + 0.76 * rightPost;

				const point = new THREE.Vector3()
					.addScaledVector(face[0], u)
					.addScaledVector(face[1], v)
					.addScaledVector(face[2], w)
					.multiplyScalar(scale);

				const object = new THREE.Object3D();
				object.position.copy(point);
				object.lookAt(point.clone().add(faceNormal));
				targets.tetrahedron.push(object);
			}

			// Renderer & Controls Setup
			renderer = new CSS3DRenderer();
			renderer.setSize(window.innerWidth, window.innerHeight);
			document.getElementById('container').appendChild(renderer.domElement);

			controls = new TrackballControls(camera, renderer.domElement);
			controls.minDistance = 500;
			controls.maxDistance = 8000;
			controls.addEventListener('change', render);

			document.getElementById('table').addEventListener('click', () => transform(targets.table, 2000));
			document.getElementById('sphere').addEventListener('click', () => transform(targets.sphere, 2000));
			document.getElementById('helix').addEventListener('click', () => transform(targets.helix, 2000));
			document.getElementById('grid').addEventListener('click', () => transform(targets.grid, 2000));
			document.getElementById('tetrahedron').addEventListener('click', () => transform(targets.tetrahedron, 2000));

			transform(targets.table, 2000);
			window.addEventListener('resize', onWindowResize);
		}

		function transform(targets, duration) {
			TWEEN.removeAll();
			for (let i = 0; i < objects.length; i++) {
				const object = objects[i];
				const target = targets[i];

				new TWEEN.Tween(object.position)
					.to({ x: target.position.x, y: target.position.y, z: target.position.z }, Math.random() * duration + duration)
					.easing(TWEEN.Easing.Exponential.InOut)
					.start();

				new TWEEN.Tween(object.rotation)
					.to({ x: target.rotation.x, y: target.rotation.y, z: target.rotation.z }, Math.random() * duration + duration)
					.easing(TWEEN.Easing.Exponential.InOut)
					.start();
			}

			new TWEEN.Tween(this)
				.to({}, duration * 2)
				.onUpdate(render)
				.start();
		}

		function onWindowResize() {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
			render();
		}

		function animate() {
			requestAnimationFrame(animate);
			TWEEN.update();
			controls.update();
		}

		function render() {
			renderer.render(scene, camera);
		}
	</script>
</body>

</html>
